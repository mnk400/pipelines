name: Refresh Monet data

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run monet pipeline
        run: bash pipeline/monet.sh monet

      - name: Commit and push
        run: |
          git diff --quiet docs/monet/ && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/monet/
          git commit -m "Refresh monet data $(date +%Y-%m-%d)"
          git pull --rebase
          git push
