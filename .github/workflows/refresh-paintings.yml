name: Refresh paintings data

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      artist:
        description: "Optional artist slug to refresh, e.g. monet or pissarro"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run paintings pipeline
        run: |
          if [ -n "${{ github.event.inputs.artist }}" ]; then
            bash pipeline/paintings.sh paintings "${{ github.event.inputs.artist }}"
          else
            bash pipeline/paintings.sh paintings
          fi

      - name: Commit and push
        run: |
          git diff --quiet docs/paintings/ && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/paintings/
          git commit -m "Refresh paintings data $(date +%Y-%m-%d)"
          git pull --rebase
          git push
